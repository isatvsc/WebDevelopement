<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    .flag{
      background-color: rgb(207, 38, 38);
      height: 600px;
      width: 900px;
      position: relative;
    }
   

    .flag > div{
      background-color: rgb(29, 29, 109);
      height: 200px;
      width: 100%;
      position: absolute;
      top: 150px;
    }

    .flag > div > div{
      font-size: 2rem;
      color: #000;
      background-color: #fff;
      height: 200px;
      width: 200px;
      border-radius: 50%;
      position: absolute;
      left: 350px;
      text-align: center;
      
      
    }

    p{
      color: #fff;
      text-align: center;
      font-size: 3rem;
    }

    .flag div> div p{
      padding-top: 20px;
      color: #000;
    }
    
  </style>
</head>

<!-- 
  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors 
and CSS specificity instead.
Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
Hint 2: You can use CSS inspection to get the colors from
https://appbrewery.github.io/flag-of-laos/
-->

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
